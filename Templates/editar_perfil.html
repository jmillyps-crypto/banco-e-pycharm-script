<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - PreçoCerto</title>
    <link rel="stylesheet" href="assets/css/perfi.css">
</head>

<body>

    <header>
        <div class="logo-header">
            <img src="assets/img/icone_logo.png" alt="Logo">
            <div>
                <h1>Preço<span>Certo</span></h1>
                <p>PRECIFICAÇÃO AFETIVA</p>
            </div>
        </div>

        <a href="#home" class="voltar">Voltar</a>
    </header>


    <main>

        <div class="barra-botoes">

            <a href="#"><img src="assets/img/icone_casa.png" alt="Início"> Início</a>
            <a href="#"><img src="assets/img/icone_caixa.png" alt="Insumos"> Insumos</a>
            <a href="#"><img src="assets/img/icone_tocapng.png" alt="Produto"> Produto</a>
            <a href="#"><img src="assets/img/icone_engrenagem.png" alt="Configurações"> Configurações</a>

            <div class="frase-lateral">
                <img src="assets/img/folhinhapng.png" alt="Folhinha" class="folhinha">
                <p>Boas escolhas hoje,melhores resultados amanhã!</p>
            </div>

            <img src="assets/img/toca.png" alt="Toca" class="toca">

        </div>

        <section>

            <h2>Meu Perfil</h2>
            <p class="subtitulo">Confira e Gerencie suas informações</p>

            <form action="">
                <div class="topo">
                    <img src="assets/img/icone_perfil.png" alt="Foto de perfil" class="avatar">
                    <div class="campos">

                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="@ seu@email.com">

                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Crie uma senha">

                        <label for="mao_de_obra">Mão de Obra</label>
                        <input type="text" id="mao_obra" name="mao_obra" placeholder="Ex: R$20,00" class="mao" required>
                    </div>
                </div>
                <a href="#home"><button type="submit">Editar Perfil</button></a>
            </form>
        </section>
    </main>

    <footer>
        <div class="logo-footer">
            <img src="assets/img/chapeu.png" alt="Logo">
            <div>
                <h2>Preço<span>Certo</span></h2>
                <p>PRECIFICAÇÃO AFETIVA</p>
            </div>
            <span class="frase">Precificação afetiva para negócios reais.</span>
        </div>

        <span>© 2026 PreçoCerto</span>
    </footer>

</body>
</html>
